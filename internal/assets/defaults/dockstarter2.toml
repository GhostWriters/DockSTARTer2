# DockSTARTer2 configuration file
# Edit this file to customise your installation.

[ui]
theme                = "DockSTARTer"
borders              = true
large_buttons        = true
large_title_bars     = true
line_characters      = true
shadow               = true
shadow_level         = 2           # 0=off 1=light(░) 2=medium(▒) 3=dark(▓) 4=solid(█)
scrollbar            = true
spinner              = true
spinner_speed        = 120         # milliseconds per spinner frame
refresh_rate         = 60          # screen repaint interval in milliseconds
border_color         = 3           # 1=primary border colour, 2=secondary, 3=both
dialog_title_align   = "center"    # "center" or "left"
submenu_title_align  = "left"      # "center" or "left"
panel_title_align    = "center"    # "center" or "left"
panel_local          = "log"       # "none", "log", "console", or "system" (for local sessions)
panel_remote         = "log"       # "none", "log", "console", or "system" (for ssh/web sessions)
checkbox_brackets    = "always"    # "never", "selected", or "always" -- the focused row's brackets always show regardless
radio_brackets       = "always"    # "never", "selected", or "always" -- the focused row's brackets always show regardless
menu_brackets        = true        # wrap the focused menu item's tag in [brackets]
line_number_brackets = true        # wrap the focused line's number in [brackets] in the env editor
tab_layout           = "sidebyside" # "maximized", "sidebyside", or "stacked" -- default view when the tabbed vars editor has 2 tabs open
show_preview         = true        # default visibility of the Appearance Settings preview panel
markdown_hyperlinks  = "inline"    # "off", "inline", or "auto" -- OSC8 hyperlink rendering for markdown (help dialog doc page, --man)
hyperlinks           = "inline"    # "off", "inline", or "auto" -- OSC8 hyperlink rendering for DS2's own console/path/link tags

[paths]
config_folder  = "${XDG_CONFIG_HOME}"
compose_folder = "${XDG_CONFIG_HOME}/compose"

# ── Remote access ─────────────────────────────────────────────────────────────
# Set server.ssh.port to a non-zero value to enable the SSH server.
# Set server.web.port to a non-zero value to also expose a browser-based terminal.
# Ports 0 (default) mean the server is disabled.

[server.ssh]
port = 40022                       # e.g. 22

[server.web]
port     = 40080                   # e.g. 80
tls      = "self-signed"           # "self-signed", "cert", or "none" (plain HTTP)
tls_cert = ""                      # path to a certificate file, when tls = "cert"
tls_key  = ""                      # path to the certificate's private key, when tls = "cert"

[server.auth]
mode          = "none"             # "none", "password", or "pubkey"
password      = ""                 # bcrypt hash; set via the TUI settings screen
auth_keys_file = ""                # path to authorized_keys file (pubkey mode)

[server]
host_key = ""                      # path to persistent host key file; auto-generated if empty

[system]
auto_setcap  = false               # keep CAP_CHOWN/CAP_FOWNER applied to the binary (Linux only,
                                   # via "sudo setcap") so permission fixes never need sudo;
                                   # re-applied automatically after updates replace the binary.
setcap_asked = false               # set automatically once the one-time auto_setcap question has
                                   # been answered; the question is skipped when auto_setcap is
                                   # already true (e.g. enabled here by hand)

# ── ANSI palette overrides ────────────────────────────────────────────────────
# Optional per-connection-type overrides for the 16 standard ANSI colors,
# substituted internally at session start rather than relying on the
# terminal's own palette. Empty (the default) means no override -- colors
# render exactly as today. Most relevant for "web": its client has no
# user-configured palette the way a real local/SSH terminal (WezTerm, etc.)
# does, so a theme's named colors (e.g. "white"/"black", which compile to
# plain ANSI codes rather than literal RGB) may render off from pure values
# unless overridden here.
# Each value accepts hex ("#ffffff"), an ANSI name, or any color name tcell
# resolves (e.g. "grey"). The 16 fields below are named after their base16/
# base24 scheme slot (e.g. "base08"), so this section reads the same as a
# scheme file's own "palette:" block -- copy a value from either straight
# into the other. Each also has a classic ANSI name (see the comment beside
# it) that works identically anywhere a slot name is accepted (here, or
# --ansi-override's <slot> argument) -- both spellings are the exact same
# color, not two separate ones; base0X is just this file's own canonical
# name for it. scheme_file points to a tinted-theming base16 or base24
# scheme YAML file (https://github.com/tinted-theming/schemes) to seed all
# 16 slots at once; any of the 16 fields set explicitly below still wins
# over the scheme for that one slot (settable individually via
# --ansi-override; "none" clears one). tint_enabled and override_enabled
# independently turn scheme_file and the 16 fields on or off as a group,
# without discarding either (set via --theme-tint/--theme-no-tint and
# --theme-ansi-override/--theme-no-ansi-override) -- either can be off
# regardless of the other.
[ansi_palette]
# apply_to_cli: whether a bare, non-interactive command (e.g. `ds2 --tint`)
# also renders with local's tint, in addition to the interactive local TUI
# (which always does). Set false for a plain/script-friendly CLI while
# keeping the tinted look in the TUI (set via --theme-cli-tint /
# --theme-no-cli-tint).
apply_to_cli = true
# apply_to_programbox: whether a ProgramBox dialog's streamed command output
# (e.g. `docker compose up` progress) renders with the session's tint, or
# with the terminal's own native palette instead (set via
# --theme-programbox-tint / --theme-no-programbox-tint).
apply_to_programbox = true

[ansi_palette.local]
tint_enabled = true
override_enabled = true
scheme_file = ""
base00 = "" # black
base08 = "" # red
base0b = "" # green
base0a = "" # yellow
base0d = "" # blue
base0e = "" # magenta
base0c = "" # cyan
base05 = "" # white
base03 = "" # bright black
base12 = "" # bright red
base14 = "" # bright green
base13 = "" # bright yellow
base16 = "" # bright blue
base17 = "" # bright magenta
base15 = "" # bright cyan
base07 = "" # bright white

