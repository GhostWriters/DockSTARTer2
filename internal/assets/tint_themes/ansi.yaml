system: "base24"
name: "ANSI"
author: "DockSTARTer2"
variant: "dark"
# Standard xterm/ANSI 16-color values, expressed as a base24 scheme so it
# loads through the same --tint-repo/--tint-file path as any other
# tinted-theming scheme, and so every color gets a real, distinct bright
# variant (base12-base17) instead of base16's fallback of reusing the
# normal color -- see ParseBase16Scheme's doc comment for the mapping.
# base01/02/04/06/09/0F/10/11 have no terminal ANSI assignment (they're
# base16/base24's background-shade and "orange"/"brown" category slots);
# their values here are unused by the 16-slot mapping and just plausible
# fill.
# If tinted-theming ever publishes an equivalent upstream scheme, this file
# can be removed and --tint-repo will resolve the name from the real repo
# clone instead.
palette:
  base00: "#000000" # black
  base01: "#262626"
  base02: "#3a3a3a"
  base03: "#7f7f7f" # bright black
  base04: "#c0c0c0"
  base05: "#e5e5e5" # white
  base06: "#f2f2f2"
  base07: "#ffffff" # bright white
  base08: "#cd0000" # red
  base09: "#ff8700"
  base0A: "#cdcd00" # yellow
  base0B: "#00cd00" # green
  base0C: "#00cdcd" # cyan
  base0D: "#0000ee" # blue
  base0E: "#cd00cd" # magenta
  base0F: "#8b4513"
  base10: "#000000"
  base11: "#000000"
  base12: "#ff0000" # bright red
  base13: "#ffff00" # bright yellow
  base14: "#00ff00" # bright green
  base15: "#00ffff" # bright cyan
  base16: "#5c5cff" # bright blue
  base17: "#ff00ff" # bright magenta
