---
name: Test

"on":
  push:
    branches:
      - main
      - WorkingCLI
  pull_request:
    branches:
      - main
      - WorkingCLI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'

      - name: Run Unit Tests
        run: go test -v ./...
